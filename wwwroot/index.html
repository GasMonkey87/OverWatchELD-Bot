<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Opening OverWatch ELD Portal</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#020617;color:#f8fafc;font-family:Segoe UI,Arial,sans-serif}.card{max-width:560px;padding:28px;border:1px solid #334155;border-radius:22px;background:#0f172a;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.35)}a{color:#38bdf8;font-weight:800}</style>
<script>
(function(){
  const qs = new URLSearchParams(location.search);
  const hasAuthError = Array.from(qs.keys()).some(k => k.toLowerCase().includes('autherror'));
  if (!hasAuthError) {
    const guildId = qs.get('guildId') || localStorage.getItem('oweld.guildId') || '';
    const target = '/driver-home.html' + (guildId ? ('?guildId=' + encodeURIComponent(guildId)) : '');
    location.replace(target);
  }
})();
</script>
</head>
<body>
<div class="card">
  <h1>Opening OverWatch ELD Portal...</h1>
  <p>If you are not redirected, <a id="link" href="/driver-home.html">open Driver Home</a>.</p>
  <p><a href="https://www.overwatcheld.com">Go to public website</a></p>
</div>
<script>
const qs = new URLSearchParams(location.search);
const guildId = qs.get('guildId') || localStorage.getItem('oweld.guildId') || '';
document.getElementById('link').href = '/driver-home.html' + (guildId ? ('?guildId=' + encodeURIComponent(guildId)) : '');
</script>
</body>
</html>
