<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>OverWatch ELD - VTC Management</title>
<style>
:root{--line:#334155;--text:#f8fafc;--muted:#94a3b8}
*{box-sizing:border-box}
body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:linear-gradient(135deg,#020617,#0f172a);color:var(--text)}
.layout{display:flex;min-height:100vh}
.sidebar{width:250px;background:#020617;border-right:1px solid var(--line);padding:18px;position:fixed;inset:0 auto 0 0}
.brand{font-size:22px;font-weight:800}.subbrand{color:var(--muted);font-size:13px;margin-bottom:20px}
.nav button{width:100%;background:transparent;border:1px solid transparent;color:var(--text);padding:13px;text-align:left;border-radius:12px;cursor:pointer;margin-bottom:7px;font-size:15px}
.nav button:hover,.nav button.active{background:#0f172a;border-color:#1e3a8a}
.main{margin-left:250px;padding:24px;width:calc(100% - 250px)}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px}
.badge{background:#082f49;color:#7dd3fc;border:1px solid #0ea5e9;padding:7px 10px;border-radius:999px;font-size:13px}
.card{background:rgba(15,23,42,.92);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 15px 35px rgba(0,0,0,.22)}
button.secondary{background:#1f2937;color:white;border:1px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer}
.muted{color:var(--muted)}
@media(max-width:850px){.sidebar{position:relative;width:100%;height:auto}.layout{display:block}.main{margin-left:0;width:100%}}
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand">OverWatch ELD</div>
    <div class="subbrand">VTC Management Center</div>
    <div class="nav">
      <button data-page="dashboard" onclick="route('dashboard')">Dashboard</button>
      <button data-page="drivers" onclick="route('drivers')">Drivers</button>
      <button data-page="fleet" onclick="route('fleet')">Fleet</button>
      <button data-page="garage" onclick="route('garage')">Garage</button>
      <button data-page="portal" onclick="route('portal')">Edit Portal</button>
      <button onclick="openPortalPage()">Open Driver Home</button>
      <button data-page="settings" onclick="route('settings')">Settings</button>
    </div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div><h1 id="pageTitle">Dashboard</h1><div class="muted" id="guildLine">Loading VTC...</div></div>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><button class="secondary" onclick="openPortalPage()">Open Driver Home</button><button class="secondary" onclick="openOldPortalPage()">Open Full VTC Portal</button><div class="badge" id="statusBadge">Connecting...</div></div>
    </div>
    <div id="content" class="card"><h2>Management Center</h2><p class="muted">This safe replacement keeps the management page online while routing Open Portal to the new driver dashboard.</p></div>
  </main>
</div>
<script>
const qs=new URLSearchParams(location.search);let guildId=qs.get('guildId')||localStorage.getItem('oweld.guildId')||'';if(guildId)localStorage.setItem('oweld.guildId',guildId);
function openPortalPage(){if(!guildId){alert('No VTC selected.');return;}window.open('/driver-home.html?guildId='+encodeURIComponent(guildId),'_blank');}
function openOldPortalPage(){if(!guildId){alert('No VTC selected.');return;}window.open('/portal.html?guildId='+encodeURIComponent(guildId),'_blank');}
function route(page){document.getElementById('pageTitle').textContent=page.charAt(0).toUpperCase()+page.slice(1);document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));document.getElementById('content').innerHTML='<h2>'+page+'</h2><p class="muted">Management tools are loading. Use Open Driver Home for the new portal dashboard.</p>';}
document.getElementById('guildLine').textContent=guildId?'Guild '+guildId:'No VTC selected';document.getElementById('statusBadge').textContent='Live';
</script>
</body>
</html>
