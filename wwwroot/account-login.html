<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OverWatch ELD Login</title>

<style>
body{
    background:#0f1117;
    color:white;
    font-family:Segoe UI;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
}

.card{
    width:420px;
    background:#1b1f2b;
    border-radius:12px;
    padding:25px;
    box-shadow:0 0 20px rgba(0,0,0,.5);
}

h1{
    text-align:center;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:12px;
    margin-bottom:10px;
    border:none;
    border-radius:6px;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:6px;
    background:#5865F2;
    color:white;
    font-size:16px;
    cursor:pointer;
}

.link{
    margin-top:15px;
    text-align:center;
}

a{
    color:#8ab4ff;
}
</style>
</head>

<body>

<div class="card">

<h1>OverWatch ELD</h1>

<input id="email" placeholder="Email Address">
<input id="password" type="password" placeholder="Password">

<button onclick="login()">Login</button>

<div class="link">
No account?
<a href="account-register.html">Create Account</a>
</div>

</div>

<script>
async function login(){

const res = await fetch("/api/account/login",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
email:document.getElementById("email").value,
password:document.getElementById("password").value
})
});

const data = await res.json();

if(data.ok){
location.href="/driver-home.html";
}
else{
alert(data.error || "Login Failed");
}
}
</script>

</body>
</html>
