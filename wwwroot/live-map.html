<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>OverWatch ELD Live Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <style>
    html, body { margin: 0; height: 100%; background: #08152f; color: white; font-family: Arial, sans-serif; }
    #map { position: absolute; inset: 0; }
    .hud {
      position: absolute; top: 12px; left: 12px; z-index: 10;
      background: rgba(8, 21, 47, 0.92); border: 1px solid rgba(125,211,252,.25);
      border-radius: 12px; padding: 12px 14px; min-width: 290px;
      box-shadow: 0 16px 38px rgba(0,0,0,.28);
    }
    .hud h2 { margin: 0 0 8px 0; font-size: 18px; }
    .muted { opacity: 0.8; font-size: 13px; line-height: 1.45; }
    .pill { display:inline-block; margin-top:8px; padding:4px 8px; border-radius:999px; background:#0f172a; border:1px solid #334155; font-size:12px; color:#bae6fd; }
    .maplibregl-popup-content { background:#020617; color:#f8fafc; border:1px solid #334155; border-radius:12px; }
    .maplibregl-popup-tip { border-top-color:#020617 !important; }
  </style>
</head>
<body>
  <div id="map"></div>

  <div class="hud">
    <h2>OverWatch Live Map</h2>
    <div id="mapStatus" class="muted">Loading…</div>
    <div id="tileStatus" class="pill">Tiles: local uploaded ATS tiles</div>
  </div>

  <script>
    function qs(name) {
      return new URLSearchParams(window.location.search).get(name) || "";
    }

    const guildId = qs("guildId");

    // Local uploaded ATS/OverWatch raster tiles.
    // Upload/copy tiles to the bot as:
    //   wwwroot/map-tiles/{z}/{x}/{y}.png
    // Example:
    //   wwwroot/map-tiles/3/2/4.png
    // The bot also supports data/map-tiles/{z}/{x}/{y}.png for mounted storage.
    const localTileUrl = "/map-tiles/{z}/{x}/{y}.png";

    const map = new maplibregl.Map({
      container: "map",
      style: {
        version: 8,
        sources: {
          overwatchTiles: {
            type: "raster",
            tiles: [localTileUrl],
            tileSize: 256,
            minzoom: 0,
            maxzoom: 8,
            attribution: "OverWatch ELD uploaded map tiles"
          }
        },
        layers: [
          {
            id: "overwatchTiles",
            type: "raster",
            source: "overwatchTiles"
          }
        ]
      },
      center: [-98.5795, 39.8283],
      zoom: 3,
      minZoom: 1,
      maxZoom: 8
    });

    map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), "top-right");

    let markers = [];
    let firstFit = true;

    function clearMarkers() {
      for (const m of markers) m.remove();
      markers = [];
    }

    function validPoint(p) {
      const lat = Number(p.latitude);
      const lon = Number(p.longitude);
      return Number.isFinite(lat) && Number.isFinite(lon) && Math.abs(lat) <= 90 && Math.abs(lon) <= 180;
    }

    function markerElement(p) {
      const el = document.createElement("div");
      el.style.width = "18px";
      el.style.height = "18px";
      el.style.borderRadius = "50%";
      el.style.background = (p.dutyStatus || "").toLowerCase().includes("driv") ? "#22c55e" : "#38bdf8";
      el.style.border = "2px solid white";
      el.style.boxShadow = "0 0 14px rgba(56,189,248,.8)";
      return el;
    }

    async function loadTileStatus() {
      try {
        const res = await fetch("/api/map/tile-status");
        const json = await res.json();
        const total = (json.roots || []).reduce((n, r) => n + (Number(r.tileCount) || 0), 0);
        document.getElementById("tileStatus").textContent = total > 0
          ? `Tiles: ${total.toLocaleString()} uploaded`
          : "Tiles: waiting for uploaded /map-tiles";
      } catch {
        document.getElementById("tileStatus").textContent = "Tiles: local route active";
      }
    }

    async function loadMapData() {
      const url = guildId
        ? `/api/map/live?guildId=${encodeURIComponent(guildId)}`
        : `/api/map/live`;

      const res = await fetch(url, { cache: "no-store" });
      const data = await res.json();

      clearMarkers();

      const points = (data.points || []).filter(validPoint);
      document.getElementById("mapStatus").textContent =
        `${points.length} drivers on map` + (guildId ? ` · Guild ${guildId}` : "");

      const bounds = new maplibregl.LngLatBounds();

      for (const p of points) {
        const popup = new maplibregl.Popup({ offset: 18 }).setHTML(`
          <strong>${p.driverName || "Driver"}</strong><br>
          Status: ${p.dutyStatus || "-"}<br>
          Truck: ${p.truck || "-"}<br>
          Load: ${p.loadNumber || "-"}<br>
          Speed: ${Math.round(p.speedMph || 0)} mph<br>
          Location: ${p.location || "-"}
        `);

        const lngLat = [Number(p.longitude), Number(p.latitude)];
        const marker = new maplibregl.Marker({ element: markerElement(p) })
          .setLngLat(lngLat)
          .setPopup(popup)
          .addTo(map);

        markers.push(marker);
        bounds.extend(lngLat);
      }

      if (firstFit && points.length > 0) {
        firstFit = false;
        map.fitBounds(bounds, { padding: 80, maxZoom: 6, duration: 800 });
      }
    }

    map.on("load", async () => {
      await loadTileStatus();
      await loadMapData();
      setInterval(loadMapData, 10000);
      setInterval(loadTileStatus, 60000);
    });
  </script>
</body>
</html>
