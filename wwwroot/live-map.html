<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>OverWatch ELD Live Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <style>
    html,body{margin:0;height:100%;background:#08152f;color:white;font-family:Segoe UI,Arial,sans-serif}#map{position:absolute;inset:0}.hud{position:absolute;top:12px;left:12px;z-index:10;background:rgba(8,21,47,.94);border:1px solid #334155;border-radius:14px;padding:12px 14px;min-width:280px;box-shadow:0 16px 40px rgba(0,0,0,.35)}.hud h2{margin:0 0 8px;font-size:18px}.muted{opacity:.82;font-size:13px}.tabs{position:absolute;right:12px;top:12px;z-index:11;display:flex;gap:8px;flex-wrap:wrap}.tabs a{background:#0f172a;color:#e5e7eb;border:1px solid #334155;text-decoration:none;padding:9px 11px;border-radius:999px;font-weight:700;font-size:13px}.tabs a:hover{background:#1e293b}.truck-marker{width:18px;height:18px;border-radius:50%;background:#22c55e;border:3px solid white;box-shadow:0 0 0 4px rgba(34,197,94,.25)}.popup{color:#0f172a;font-size:13px}.popup b{font-size:15px}
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="tabs">
    <a id="fleetLink">Fleet</a><a id="convoyLink">Convoy</a><a id="garageLink">Garages</a><a id="loadsLink">Loads</a><a id="portalLink">Portal</a>
  </div>
  <div class="hud"><h2>OverWatch Live Map</h2><div id="mapStatus" class="muted">Loading telemetry…</div><div id="mapSource" class="muted"></div></div>
<script>
const qs=new URLSearchParams(location.search);const guildId=qs.get('guildId')||localStorage.getItem('oweld.guildId')||'';if(guildId)localStorage.setItem('oweld.guildId',guildId);
['fleet','convoy','garage','loads','portal'].forEach(n=>{const el=document.getElementById(n+'Link');if(el)el.href=`/${n==='garage'?'garages':n}.html?guildId=${encodeURIComponent(guildId)}`});
const map=new maplibregl.Map({container:'map',style:{version:8,sources:{osm:{type:'raster',tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],tileSize:256,attribution:'© OpenStreetMap contributors'}},layers:[{id:'osm',type:'raster',source:'osm'}]},center:[-98.5795,39.8283],zoom:3});
let markers=[];function clearMarkers(){for(const m of markers)m.remove();markers=[]}function esc(v){return String(v??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[s]))}function ll(p){const lng=Number(p.longitude??p.Longitude??p.lng??p.Lng??p.lon??p.Lon);const lat=Number(p.latitude??p.Latitude??p.lat??p.Lat);return Number.isFinite(lng)&&Number.isFinite(lat)&&Math.abs(lng)<=180&&Math.abs(lat)<=90?[lng,lat]:null}function nameOf(p){return p.driverName||p.DriverName||p.driver||p.Driver||p.discordUsername||p.truck||p.truckName||'Driver'}
async function loadMapData(){if(!guildId){mapStatus.textContent='Missing guildId. Open live-map.html?guildId=YOUR_SERVER_ID';return}let data;try{const res=await fetch(`/api/map/live?guildId=${encodeURIComponent(guildId)}`,{credentials:'include'});data=await res.json()}catch(e){mapStatus.textContent='Live map request failed.';return}clearMarkers();const points=data.points||data.data||[];let valid=0;let bounds=new maplibregl.LngLatBounds();for(const p of points){const pos=ll(p);if(!pos)continue;valid++;bounds.extend(pos);const el=document.createElement('div');el.className='truck-marker';const marker=new maplibregl.Marker({element:el}).setLngLat(pos).setPopup(new maplibregl.Popup({offset:18}).setHTML(`<div class="popup"><b>${esc(nameOf(p))}</b><br>Status: ${esc(p.dutyStatus||p.status||'Live')}<br>Truck: ${esc(p.truck||p.truckName||'-')}<br>Load: ${esc(p.loadNumber||'-')}<br>Speed: ${Math.round(Number(p.speedMph||0))} mph<br>Location: ${esc(p.location||'')}<br>Pickup: ${esc(p.sourceCompany||'-')} ${esc(p.sourceCity||'')}<br>Drop: ${esc(p.destinationCompany||'-')} ${esc(p.destinationCity||'')}</div>`)).addTo(map);markers.push(marker)}mapStatus.textContent=valid?`${valid} live driver${valid===1?'':'s'} polling from ATS telemetry.`:`No valid driver coordinates. Raw units: ${points.length}`;mapSource.textContent=`Source: ${data.source||'map/live'} · ${new Date().toLocaleTimeString()}`;if(valid&&!bounds.isEmpty())map.fitBounds(bounds,{padding:80,maxZoom:7,duration:800})}
map.on('load',()=>{loadMapData();setInterval(loadMapData,7000)});
</script>
</body>
</html>
